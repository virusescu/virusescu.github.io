<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>virusescu | Senior Software Engineer @ EA Sports FC Dev</title>
  <meta name="description" content="Personal website of virusescu - Senior Software Engineer in EA Sports FC Dev.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><polygon points='20,36 4,8 36,8' fill='%2300ff85'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <a href="#" class="brand">
      <div class="logo-icon">
        <svg viewBox="0 0 40 40" width="26" height="26" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Geometric triangular badge inspired by EA FC marker -->
          <polygon points="20,34 6,9 34,9" fill="rgba(0, 255, 133, 0.15)" stroke="#00ff85" stroke-width="2.5" stroke-linejoin="round"/>
          <!-- Bold 'V' lettermark -->
          <polyline points="13,15 20,27 27,15" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-title">virusescu</span>
        <span class="brand-subtitle">EA Sports FC Dev</span>
      </div>
    </a>

    <div class="badge">
      <span class="badge-dot"></span>
      <span>Senior Software Engineer</span>
    </div>
  </header>

  <!-- Hero Content -->
  <main>
    <div class="intro">
      <p class="tagline">Hello, World</p>
      <h1>Engineering the Game</h1>
      <p class="role-description">
        I am <span class="highlight">virusescu</span>, Senior Software Engineer working on 
        <span class="highlight">EA Sports FC Dev</span>.
      </p>
    </div>

    <!-- Center Live Clock Card -->
    <div class="clock-card">
      <div class="clock-label">Current System Time</div>
      <div id="clock-time" class="clock-time">00:00:00</div>
      <div id="clock-date" class="clock-date">Loading date...</div>
      <div class="clock-footer">
        <span id="clock-timestamp">UNIX: 0</span>
        <span id="clock-timezone">TZ: Local</span>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <span>&copy; 2026 virusescu &bull; EA Sports FC Dev</span>
    <div>
      <a href="https://github.com/virusescu" target="_blank" rel="noopener noreferrer">GitHub</a>
    </div>
  </footer>

  <!-- Vanilla JavaScript -->
  <script src="app.js"></script>
</body>
</html>
